name: Build personal APK

on:
  push:
    branches:
      - my-beta3
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Write sign info
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without these secrets the APK is signed with a throwaway debug key,
          # so each build would need the previous one uninstalled first.
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
              echo "storeFile=$GITHUB_WORKSPACE/key.jks"
            } > keystore.properties
          else
            echo "::warning::KEYSTORE secret not set; signing with a debug key."
          fi
      - name: Build APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Lawnchair-APK
          path: build/outputs/apk/**/*.apk
